<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraveDash 3-App Ecosystem Preview</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #1e293b; margin: 0; padding: 0; }
    .phone-container { width: 410px; height: 850px; background: #ffffff; border-radius: 48px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 12px #1e293b; position: relative; overflow: hidden; }
    .scroll-custom::-webkit-scrollbar { width: 4px; }
    .scroll-custom::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="flex flex-col md:flex-row items-center gap-8 max-w-6xl w-full justify-center">
    
    <!-- Left Overview Panel -->
    <div class="text-white max-w-md space-y-4 text-center md:text-left">
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-purple-500/20 text-purple-300 text-xs font-bold uppercase tracking-wider border border-purple-500/30">
        <i data-lucide="layers" class="w-4 h-4"></i> 3-App Food Delivery Ecosystem
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">CraveDash Platform</h1>
      <p class="text-slate-400 text-xs leading-relaxed">
        Complete commercial food delivery system with 3 role-based applications sharing a cohesive visual identity:
      </p>

      <div class="space-y-2 text-xs">
        <div onclick="switchApp('customer')" class="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl flex items-center justify-between cursor-pointer hover:bg-rose-500/20">
          <div class="flex items-center gap-2 text-rose-400 font-bold"><i data-lucide="user" class="w-4 h-4"></i> 1. Customer Food App</div>
          <span class="text-[10px] bg-rose-500 text-white font-extrabold px-2 py-0.5 rounded">TEST ROLE</span>
        </div>
        <div onclick="switchApp('restaurant')" class="p-3 bg-purple-500/10 border border-purple-500/30 rounded-xl flex items-center justify-between cursor-pointer hover:bg-purple-500/20">
          <div class="flex items-center gap-2 text-purple-400 font-bold"><i data-lucide="store" class="w-4 h-4"></i> 2. Restaurant Partner App</div>
          <span class="text-[10px] bg-purple-600 text-white font-extrabold px-2 py-0.5 rounded">TEST ROLE</span>
        </div>
        <div onclick="switchApp('delivery')" class="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl flex items-center justify-between cursor-pointer hover:bg-emerald-500/20">
          <div class="flex items-center gap-2 text-emerald-400 font-bold"><i data-lucide="bike" class="w-4 h-4"></i> 3. Delivery Partner App</div>
          <span class="text-[10px] bg-emerald-600 text-white font-extrabold px-2 py-0.5 rounded">TEST ROLE</span>
        </div>
      </div>
    </div>

    <!-- Phone Container Frame -->
    <div class="phone-container flex flex-col relative bg-slate-50">
      
      <!-- Top Ecosystem Role Switcher Banner -->
      <div class="bg-slate-900 px-3 py-2 text-white border-b border-slate-800 pt-6">
        <p class="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest text-center mb-1">ECOSYSTEM ROLE SWITCHER</p>
        <div class="grid grid-cols-3 gap-1 bg-slate-800 p-1 rounded-full text-[11px] font-bold">
          <button onclick="switchApp('customer')" id="role-customer" class="py-1.5 rounded-full bg-rose-500 text-white text-center">Customer</button>
          <button onclick="switchApp('restaurant')" id="role-restaurant" class="py-1.5 rounded-full text-slate-400 text-center">Restaurant</button>
          <button onclick="switchApp('delivery')" id="role-delivery" class="py-1.5 rounded-full text-slate-400 text-center">Rider</button>
        </div>
      </div>

      <!-- Main Dynamic App Body -->
      <div id="app-body" class="flex-1 overflow-y-auto scroll-custom bg-slate-50">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div>

  <script>
    let currentApp = 'customer';

    function switchApp(app) {
      currentApp = app;
      const body = document.getElementById('app-body');
      
      ['customer', 'restaurant', 'delivery'].forEach(r => {
        const btn = document.getElementById(`role-${r}`);
        if (r === app) {
          if (r === 'customer') btn.className = 'py-1.5 rounded-full bg-rose-500 text-white font-bold text-center';
          if (r === 'restaurant') btn.className = 'py-1.5 rounded-full bg-purple-600 text-white font-bold text-center';
          if (r === 'delivery') btn.className = 'py-1.5 rounded-full bg-emerald-600 text-white font-bold text-center';
        } else {
          btn.className = 'py-1.5 rounded-full text-slate-400 text-center';
        }
      });

      if (app === 'customer') renderCustomerApp(body);
      if (app === 'restaurant') renderRestaurantApp(body);
      if (app === 'delivery') renderDeliveryApp(body);

      lucide.createIcons();
    }

    function renderCustomerApp(el) {
      el.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="bg-gradient-to-r from-rose-500 to-pink-600 text-white p-4 rounded-2xl shadow-lg">
            <span class="text-[10px] font-extrabold uppercase bg-black/20 px-2 py-0.5 rounded-full">CUSTOMER APP</span>
            <h2 class="font-extrabold text-base mt-1">Order Food Online</h2>
            <p class="text-xs text-rose-100">Top Hyderabadi Biryani & Smash Burgers</p>
          </div>

          <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-2">
            <h3 class="font-extrabold text-xs text-slate-800">1. Select Restaurant</h3>
            <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
              <div>
                <p class="font-bold text-xs text-slate-900">The Royal Biryani House</p>
                <p class="text-[10px] text-slate-400">★ 4.8 • 28 mins delivery</p>
              </div>
              <button onclick="switchApp('restaurant')" class="bg-purple-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
                View in Restaurant App →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderRestaurantApp(el) {
      el.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="bg-purple-700 text-white p-4 rounded-2xl shadow-lg">
            <span class="text-[10px] font-extrabold uppercase bg-black/20 px-2 py-0.5 rounded-full">RESTAURANT PARTNER APP</span>
            <h2 class="font-extrabold text-base mt-1">The Royal Biryani House</h2>
            <p class="text-xs text-purple-200">Today's Revenue: ₹18,450 • 124 Orders</p>
          </div>

          <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <h3 class="font-extrabold text-xs text-slate-800">Live Kitchen Orders (KDS)</h3>
            <div class="p-3 bg-purple-50 border border-purple-200 rounded-xl space-y-2">
              <div class="flex justify-between text-xs font-extrabold">
                <span>#ORD-98421 • Aarav Sharma</span>
                <span class="text-purple-700">NEW ORDER</span>
              </div>
              <p class="text-xs text-slate-600">1x Hyderabadi Chicken Dum Biryani, 1x Extra Raita (₹533)</p>
              <button onclick="alert('Accepted! Order sent to kitchen & delivery driver notified.'); switchApp('delivery');" class="w-full bg-purple-600 text-white text-xs font-bold py-2 rounded-lg">
                Accept Order & Notify Rider →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderDeliveryApp(el) {
      el.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="bg-emerald-700 text-white p-4 rounded-2xl shadow-lg">
            <span class="text-[10px] font-extrabold uppercase bg-black/20 px-2 py-0.5 rounded-full">DELIVERY PARTNER APP</span>
            <h2 class="font-extrabold text-base mt-1">Kabir Verma (Rider)</h2>
            <p class="text-xs text-emerald-200">Today's Earnings: ₹1,240 • 14 Deliveries</p>
          </div>

          <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <h3 class="font-extrabold text-xs text-slate-800">Incoming Delivery Request</h3>
            <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2">
              <div class="flex justify-between text-xs font-extrabold text-emerald-800">
                <span>Pickup: The Royal Biryani House</span>
                <span class="text-emerald-600">+₹85 Earned</span>
              </div>
              <p class="text-xs text-slate-600">Drop: Aarav Sharma (Flat 402, Green Valley)</p>
              <button onclick="alert('Order Picked up & Delivered! Earned +₹85'); switchApp('customer');" class="w-full bg-emerald-600 text-white text-xs font-bold py-2 rounded-lg">
                Accept & Confirm Delivery →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    switchApp('customer');
  </script>
</body>
</html>
